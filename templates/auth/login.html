{# PATH: GovScheme/templates/auth/login.html #}
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login - SmartGov AI</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/base/variables.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/base/reset.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/base/typography.css') }}">
</head>
<body class="d-flex align-items-center" style="min-height:100vh; background: linear-gradient(135deg,var(--sg-primary),var(--sg-primary-dark));">
<div class="container">
  <div class="row justify-content-center">
    <div class="col-md-5">
      <div class="card shadow border-0 p-4" style="border-radius: var(--sg-radius);">
        <div class="text-center mb-3">
          <i class="bi bi-shield-check" style="font-size:2rem;color:var(--sg-primary);"></i>
          <h3 class="mt-2 mb-0">SmartGov AI</h3>
          <div class="text-muted-sg small">Government Scheme Eligibility &amp; Assistance</div>
        </div>
        {% with messages = get_flashed_messages(with_categories=true) %}
          {% for category, message in messages %}
            <div class="alert alert-{{ category }}">{{ message }}</div>
          {% endfor %}
        {% endwith %}
        <form method="post">
          <div class="mb-3">
            <label class="form-label">Email</label>
            <input type="email" name="email" class="form-control" required>
          </div>
          <div class="mb-3">
            <label class="form-label">Password</label>
            <input type="password" name="password" class="form-control" required>
          </div>
          <button type="submit" class="btn btn-success w-100">Log In</button>
        </form>
        <div class="text-center mt-3 small">
          New here? <a href="{{ url_for('auth.register') }}">Create an account</a>
        </div>
      </div>
    </div>
  </div>
</div>
</body>
</html>
